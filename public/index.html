<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1024 造物挑战 · 赛事监控台</title>
<meta name="description" content="WorkBuddy 1024 造物挑战作品监控台：实时同步官方公开数据，AI 按官方评审细则为每件作品生成模拟评分与画像。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
</head>
<body>
<div class="app">

  <!-- ============ 象图导航轨 ============ -->
  <nav class="rail" id="rail">
    <div class="mark" title="1024 造物挑战 · 赛事监控台">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#FBFAF7" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M10 5.5l1.7 3.6 3.9.5-2.8 2.7.7 3.9-3.5-1.9-3.5 1.9.7-3.9-2.8-2.7 3.9-.5z"/></svg>
    </div>
    <a class="it" href="#/" data-route="">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.4"/><path d="M8 1.6v12.8M1.6 8h12.8"/></svg>
      <span>总览</span>
    </a>
    <a class="it" href="#/works" data-route="works">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.6" y="1.6" width="5.4" height="5.4"/><rect x="9" y="1.6" width="5.4" height="5.4"/><rect x="1.6" y="9" width="5.4" height="5.4"/><rect x="9" y="9" width="5.4" height="5.4"/></svg>
      <span>作品</span>
    </a>
    <a class="it" href="#/ratings" data-route="ratings">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 14.4h10M4.6 14.4V9.2M8 14.4V4.4M11.4 14.4V6.8"/></svg>
      <span>评审</span>
      <i class="badge" id="aiNavBadge" hidden></i>
    </a>
    <a class="it" href="#/insights" data-route="insights">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.6 13.6L5.6 8l3.2 2.6L14.4 3.6"/><path d="M14.4 3.6h-3.4M14.4 3.6v3.4"/></svg>
      <span>洞察</span>
    </a>
    <a class="it" href="#/feed" data-route="feed">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.6 8h2.8l1.8-4.6 2.6 9.2 1.8-4.6h3.6"/></svg>
      <span>动态</span>
    </a>
    <a class="it" href="#/about" data-route="about">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.4"/><path d="M8 7.2v4M8 4.6v.1"/></svg>
      <span>关于</span>
    </a>
  </nav>

  <div class="main">
    <!-- ============ 状态带 ============ -->
    <header class="band">
      <div class="logo">1024 造物挑战</div>
      <div class="cd">投稿截止 <b id="countdown" class="num">D-–</b></div>
      <div class="sp"></div>
      <a class="gh" href="https://github.com/xiaojiaenen/wb1024-monitor" target="_blank" rel="noopener" title="本项目已开源">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>开源</span>
      </a>
      <div class="live"><span class="dot"></span><span id="clock">LIVE</span></div>
    </header>
    <div class="notice" id="notice">
      <span class="sq"></span>
      <span>社区非官方监控台，数据取自官方公开页面；若官方调整页面结构可能导致数据中断，届时以官方页面为准</span>
    </div>

    <!-- ============ 页面容器 ============ -->
    <main class="page" id="page"><div class="empty">数据加载中…</div></main>
  </div>
</div>

<!-- ============ 作品详情抽屉 ============ -->
<div class="mask" id="modalMask" hidden>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true">
    <div class="drawer-body" id="modalBody"></div>
    <div class="drawer-foot" id="modalFoot"></div>
  </div>
</div>

<!-- ============ 截图灯箱（点击空白处关闭） ============ -->
<div class="mask lightbox" id="lightboxMask" hidden>
  <img id="lightboxImg" src="" alt="作品截图放大">
</div>

<div class="toast" id="toast" hidden></div>

<script src="cloud.js"></script>
<script src="analysis.js"></script>
<script src="app.js"></script>
</body>
</html>
